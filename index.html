<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCraft - AI 项目灵感雷达</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--card:#1a1a2e;--border:#2a2a3e;
  --text:#e0e0f0;--dim:#8888aa;--accent:#6c5ce7;--accent2:#00cec9;
  --play:#fd79a8;--use:#0984e3;--hw:#00b894;--star:#fdcb6e;
  --radius:12px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.6}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 0}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.nav-links a{padding:6px 14px;border-radius:20px;font-size:.85rem;color:var(--dim);transition:.2s}
.nav-links a:hover,.nav-links a.active{color:#fff;background:var(--accent)}

/* HERO */
.hero{text-align:center;padding:80px 24px 40px;max-width:900px;margin:0 auto}
.hero h1{font-size:2.8rem;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,var(--play),var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--dim);font-size:1.1rem;max-width:600px;margin:0 auto 32px}

/* STATS */
.stats{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.stat{text-align:center;padding:20px 28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.stat .num{font-size:2rem;font-weight:800;color:var(--accent2)}
.stat .label{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

/* PICKER */
.picker{max-width:1000px;margin:0 auto 60px;padding:0 24px}
.picker-title{font-size:1.4rem;font-weight:700;margin-bottom:8px}
.picker-desc{color:var(--dim);margin-bottom:24px;font-size:.9rem}
.picker-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:24px}
.picker-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.picker-group h3{font-size:.85rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.bubble{display:inline-block;padding:8px 16px;border-radius:20px;border:1px solid var(--border);font-size:.85rem;margin:4px;cursor:pointer;transition:.2s;background:transparent;color:var(--text)}
.bubble:hover{border-color:var(--accent);color:var(--accent)}
.bubble.selected{background:var(--accent);border-color:var(--accent);color:#fff}

/* RECOMMENDATIONS */
.recs{max-width:1000px;margin:0 auto 60px;padding:0 24px}
.recs-title{font-size:1.4rem;font-weight:700;margin-bottom:20px}
.rec-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.rec-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;transition:.2s}
.rec-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.rec-rank{position:absolute;top:12px;right:16px;font-size:.75rem;color:var(--dim)}
.rec-track{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.7rem;font-weight:600;margin-bottom:8px}
.track-play{background:rgba(253,121,168,.15);color:var(--play)}
.track-use{background:rgba(9,132,227,.15);color:var(--use)}
.track-hw{background:rgba(0,184,148,.15);color:var(--hw)}
.track-star{background:rgba(253,203,110,.15);color:var(--star)}
.rec-card h3{font-size:1rem;font-weight:700;margin-bottom:8px}
.rec-card p{font-size:.85rem;color:var(--dim);margin-bottom:12px;line-height:1.5}
.rec-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rec-tag{padding:3px 10px;border-radius:10px;font-size:.7rem;background:rgba(108,92,231,.12);color:var(--accent)}
.rec-score{font-size:.8rem;color:var(--accent2);font-weight:600;margin-bottom:12px}
.rec-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:6px 14px;border-radius:16px;font-size:.75rem;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:.2s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}

/* BOARD */
.board{max-width:1200px;margin:0 auto 60px;padding:0 24px}
.board-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.board-header h2{font-size:1.6rem;font-weight:800}
.board-tabs{display:flex;gap:8px;flex-wrap:wrap}
.board-tab{padding:8px 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:.85rem;transition:.2s}
.board-tab:hover{border-color:var(--accent);color:var(--text)}
.board-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.board-search{margin-left:auto;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.85rem;width:200px;outline:none}
.board-search:focus{border-color:var(--accent)}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:.2s}
.proj-card:hover{border-color:var(--accent)}
.proj-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.proj-num{font-size:.75rem;color:var(--dim);min-width:28px}
.proj-card h3{font-size:.95rem;font-weight:700;flex:1}
.proj-card>p{font-size:.82rem;color:var(--dim);margin-bottom:10px;line-height:1.5}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.proj-tag{padding:3px 10px;border-radius:10px;font-size:.7rem;background:rgba(108,92,231,.12);color:var(--accent)}
.proj-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.proj-score{font-size:.8rem;font-weight:700}
.proj-links{display:flex;gap:6px}
.proj-link{padding:5px 12px;border-radius:14px;font-size:.72rem;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;transition:.2s}
.proj-link:hover{border-color:var(--accent2);color:var(--accent2)}

/* STARS */
.stars-section{max-width:1200px;margin:0 auto 60px;padding:0 24px}
.stars-header{margin-bottom:24px}
.stars-header h2{font-size:1.6rem;font-weight:800;margin-bottom:4px}
.stars-header p{color:var(--dim);font-size:.9rem}
.stars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.star-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:.2s}
.star-card:hover{border-color:var(--star)}
.star-rank{font-size:.75rem;color:var(--star);font-weight:700;margin-bottom:6px}
.star-card h3{font-size:.9rem;font-weight:700;margin-bottom:4px}
.star-card p{font-size:.82rem;color:var(--dim);margin-bottom:8px;line-height:1.4}
.star-meta{display:flex;gap:10px;font-size:.75rem;color:var(--accent2)}

/* FOOTER */
.footer{text-align:center;padding:40px 24px;border-top:1px solid var(--border);color:var(--dim);font-size:.8rem}
.footer a{color:var(--accent2)}

/* RESPONSIVE */
@media(max-width:640px){
  .hero h1{font-size:1.8rem}
  .stats{gap:12px}
  .stat{padding:12px 16px}
  .stat .num{font-size:1.4rem}
  .board-grid,.rec-cards,.stars-grid{grid-template-columns:1fr}
  .board-search{width:100%;margin-left:0;margin-top:12px}
}
</style>
</head>

function getRecommendations() {
  const {time,goal,form,comfort} = state.selections;
  
  // Score each project based on selections
  const scored = PROJECTS.map(p => {
    let s = p.score;
    
    // Time mapping
    const timeMap = {newbie:"半天",deps:"1天",api:"2天",hw2:"3天"};
    if (time === "2h") s += (p.mvp.includes("半天") ? 20 : p.mvp.includes("1天") ? 10 : -10);
    if (time === "weekend") s += (p.mvp.includes("1-2天") ? 20 : p.mvp.includes("2天") ? 15 : p.mvp.includes("1天") ? 10 : 0);
    if (time === "week") s += (p.mvp.includes("3") ? 15 : p.mvp.includes("2") ? 10 : 5);
    if (time === "long") s += 10;
    
    // Goal mapping
    if (goal === "demo") s += (p.tags.some(t => t.includes("演示") || t.includes("视觉") || t.includes("分享")) ? 15 : 0);
    if (goal === "self") s += (p.track === "use" ? 10 : 0);
    if (goal === "work") s += (p.track === "use" ? 15 : 0);
    if (goal === "explore") s += (p.track === "star" ? 20 : 5);
    
    // Form mapping
    if (form === "web") s += (p.track === "play" ? 15 : p.track === "use" ? 10 : -5);
    if (form === "data") s += (p.track === "use" ? 15 : 0);
    if (form === "agent") s += (p.tags.some(t => t.includes("AI")) ? 15 : 0);
    if (form === "hw") s += (p.track === "hw" ? 20 : -10);
    
    // Comfort mapping
    if (comfort === "newbie") s += (p.mvp.includes("半天") ? 15 : p.mvp.includes("1天") ? 10 : 0);
    if (comfort === "deps") s += 5;
    if (comfort === "api") s += 5;
    if (comfort === "hw2") s += (p.track === "hw" ? 15 : 0);
    
    return {...p, finalScore: s};
  });
  
  scored.sort((a,b) => b.finalScore - a.finalScore);
  return scored.slice(0, 3);
}

function renderRecommendations() {
  const recs = getRecommendations();
  const container = document.getElementById('recs');
  const trackNames = {play:"好玩",use:"好用",hw:"好搓",star:"明星"};
  const trackClasses = {play:"track-play",use:"track-use",hw:"track-hw",star:"track-star"};
  
  container.innerHTML = `
    <div class="recs-title">🎯 为你推荐</div>
    <div class="rec-cards">
      ${recs.map((p,i) => `
        <div class="rec-card">
          <div class="rec-rank">#${i+1}</div>
          <span class="rec-track ${trackClasses[p.track]}">${trackNames[p.track]}</span>
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div class="rec-tags">${p.tags.map(t=>`<span class="rec-tag">${t}</span>`).join('')}</div>
          <div class="rec-score">⭐ ${p.finalScore} 分 · MVP ${p.mvp}</div>
          <div class="rec-actions">
            ${p.source ? `<a class="btn-sm" href="${p.source}" target="_blank">📦 源码</a>` : ''}
            ${p.demo ? `<a class="btn-sm" href="${p.demo}" target="_blank">🎮 演示</a>` : ''}

          </div>
        </div>
      `).join('')}
    </div>
  `;
}

  document.getElementById('starsGrid').innerHTML = STARS.map(s => `
    <div class="star-card">
      <div class="star-rank">#${s.rank} ${s.stars}</div>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
      <div class="rec-tags">${s.tags.map(t=>`<span class="rec-tag">${t}</span>`).join('')}</div>
      <a class="btn-sm" href="${s.url}" target="_blank" style="margin-top:8px;display:inline-block">🔗 GitHub</a>
    </div>
  `).join('');
}

function renderBoardTabs() {
  const tabs = [
    {id:"all",label:"全部"},
    {id:"play",label:"好玩"},
    {id:"use",label:"好用"},
    {id:"hw",label:"好搓"},
    {id:"star",label:"明星"}
  ];
  document.getElementById('boardTabs').innerHTML = tabs.map(t =>
    `<button class="board-tab ${state.boardFilter===t.id?'active':''}" data-filter="${t.id}">${t.label}</button>`
  ).join('');
}

function renderBoard() {
  let items = state.boardFilter === 'star' ? STARS.map(s => ({
    id: 's'+s.rank, track:'star', name:s.name, desc:s.desc, tags:s.tags,
    score:0, mvp:'', source:s.url, demo:'', stars:s.stars
  })) : [...PROJECTS];

  if (state.boardFilter !== 'all' && state.boardFilter !== 'star') {
    items = items.filter(p => p.track === state.boardFilter);
  }

  if (state.boardSearch) {
    const q = state.boardSearch.toLowerCase();
    items = items.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.desc.toLowerCase().includes(q) ||
      p.tags.some(t => t.toLowerCase().includes(q))
    );
  }

  const trackNames = {play:"好玩",use:"好用",hw:"好搓",star:"明星"};
  const trackClasses = {play:"track-play",use:"track-use",hw:"track-hw",star:"track-star"};

  document.getElementById('boardGrid').innerHTML = items.map((p,i) => `
    <div class="proj-card">
      <div class="proj-head">
        <span class="proj-num">#${p.id}</span>
        <span class="rec-track ${trackClasses[p.track]}">${trackNames[p.track]}</span>
        <h3>${p.name}</h3>
      </div>
      <p>${p.desc}</p>
      <div class="proj-tags">${p.tags.map(t=>`<span class="proj-tag">${t}</span>`).join('')}</div>
      <div class="proj-bottom">
        <span class="proj-score" style="color:var(--accent2)">${p.stars ? p.stars : '⭐ ' + p.score + ' · MVP ' + p.mvp}</span>
        <div class="proj-links">
          ${p.source ? `<a class="proj-link" href="${p.source}" target="_blank">源码</a>` : ''}
          ${p.demo ? `<a class="proj-link" href="${p.demo}" target="_blank">演示</a>` : ''}
        </div>
      </div>
    </div>
  `).join('') || '<p style="color:var(--dim);grid-column:1/-1;text-align:center;padding:40px">没有找到匹配的项目</p>';
}

function setupEvents() {
  // Picker bubbles
  document.getElementById('pickerGroups').addEventListener('click', e => {
    const bubble = e.target.closest('.bubble');
    if (!bubble) return;
    const group = bubble.dataset.group;
    const value = bubble.dataset.value;
    state.selections[group] = value;
    renderPicker();
    renderRecommendations();
  });

  // Board tabs
  document.getElementById('boardTabs').addEventListener('click', e => {
    const tab = e.target.closest('.board-tab');
    if (!tab) return;
    state.boardFilter = tab.dataset.filter;
    renderBoardTabs();
    renderBoard();
  });

  // Board search
  document.getElementById('boardSearch').addEventListener('input', e => {
    state.boardSearch = e.target.value;
    renderBoard();
  });
}

function copyPrompt(name) {
  const prompt = `我想做一个叫"${name}"的 Vibe Coding 项目。请帮我：\n1. 分析这个项目的核心功能\n2. 选择合适的技术栈\n3. 制定 MVP 开发计划\n4. 给出开工的第一步`;
  navigator.clipboard.writeText(prompt).then(() => {
    alert('✅ 开工提示词已复制到剪贴板！');
  }).catch(() => {
    prompt('复制以下提示词：', prompt);
  });
}

init();
</script>
</body>
</html>
