name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/update_stars.py
      - name: Validate PWA metadata
        run: python -c "import json; json.load(open('manifest.json', encoding='utf-8'))"
      - name: Validate entrypoint
        run: python -c "from pathlib import Path; text=Path('index.html').read_text(encoding='utf-8'); assert '<html' in text.lower() and 'const STARS = [' in text"
      - name: Validate embedded JavaScript
        run: >-
          node -e "const fs=require('fs'),vm=require('vm'); const html=fs.readFileSync('index.html','utf8');
          const scripts=html.split('<script').slice(1).map(block=>block.slice(block.indexOf('>')+1).split('</script>')[0]);
          if(!scripts.length) throw new Error('no script block'); for(const source of scripts) new vm.Script(source);"
